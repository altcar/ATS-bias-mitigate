name: Publish site

# Publishes the whole hackathon folder to GitHub Pages on every push to main.
# index.html (the one-page site) is served at the site root; every other file
# keeps its path, so the deck, PDF, DOCX and evidence book are all reachable.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish, but keep only one queued run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Stage static site
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            ./ _site/

          # Serve the one-page site at the site root. It references assets/
          # relatively, so those are mirrored next to it and the one link to
          # the evidence book is rewritten for the new depth.
          cp ats-bias-audit/index.html _site/index.html
          cp -R ats-bias-audit/assets _site/assets
          sed -i 's|href="analysis.html"|href="ats-bias-audit/analysis.html"|g' _site/index.html

          # Skip Jekyll processing; the files are already static HTML.
          touch _site/.nojekyll

          echo "Staged $(find _site -type f | wc -l) files, $(du -sh _site | cut -f1):"
          find _site -maxdepth 2 -type f | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
